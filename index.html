<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國中英文：動詞三態闖關 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f5f9;color:#202733;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:flex;justify-content:center}main{width:min(100%,700px);background:white;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 28px #15223b12}h1{font-size:1.5rem;margin:0 0 8px}.sub{color:#667085;line-height:1.6}.top{display:flex;justify-content:space-between;gap:12px}.track{height:8px;background:#e8ebf1;border-radius:99px;overflow:hidden;margin:12px 0 24px}#bar{height:100%;background:#4263eb;width:0}#question{font-size:1.2rem;line-height:1.65;margin:12px 0 18px}.option{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin:10px 0;border:1.5px solid #d7dce5;border-radius:13px;background:white;font-size:1rem;cursor:pointer;color:inherit}.letter{width:30px;height:30px;border-radius:50%;background:#f0f2f7;display:grid;place-items:center;font-weight:700;flex-shrink:0}.correct{border-color:#18864b!important;background:#effaf3!important}.wrong{border-color:#c33!important;background:#fff3f2!important}.option:disabled{cursor:default}#feedback{display:none;margin-top:18px;padding:15px;border-radius:12px;background:#f2f4f8;line-height:1.7}button.primary{border:0;border-radius:12px;background:#263b80;color:white;font-size:1rem;font-weight:700;padding:13px;width:100%;margin-top:16px;cursor:pointer}#result{display:none}.score{font-size:2rem;font-weight:800;text-align:center;margin:20px 0}.review{padding:12px 0;border-bottom:1px solid #e7e9ef;line-height:1.55}.small{font-size:.9rem;color:#667085}
</style></head><body><main><h1>國中英文：動詞三態闖關 2.0</h1><p class="sub">20 題｜立即回饋與解析｜完成後查看總分與錯題｜涵蓋常見規則及不規則動詞</p>
<section id="game"><div class="top"><strong>互動練習</strong><span id="count"></span></div><div class="track"><div id="bar"></div></div><div id="question"></div><div id="options"></div><div id="feedback" aria-live="polite"></div><button class="primary" id="next" style="display:none">下一題</button></section>
<section id="result"><h2>練習完成！</h2><div class="score" id="score"></div><div id="review"></div><button class="primary" id="again">再練一次</button></section></main>
<script>
const qs = [{"q": "go 的三態是哪一組？", "o": ["go－goed－goed", "go－went－gone", "go－gone－went", "go－went－went"], "a": 1, "e": "go → went → gone。V2 是 went，V3 是 gone。"}, {"q": "She has _____ her lunch already.", "o": ["eat", "ate", "eaten", "eating"], "a": 2, "e": "has + V3，因此用 eaten。"}, {"q": "We _____ to the museum last Sunday.", "o": ["go", "went", "gone", "going"], "a": 1, "e": "last Sunday 表示過去時間，用 V2 went。"}, {"q": "write 的三態是哪一組？", "o": ["write－wrote－written", "write－written－wrote", "write－writed－written", "write－wrote－wrote"], "a": 0, "e": "write → wrote → written。"}, {"q": "My brother has _____ his keys.", "o": ["lose", "lost", "losing", "loses"], "a": 1, "e": "lose → lost → lost；has 後面用 V3 lost。"}, {"q": "They _____ a big cake yesterday.", "o": ["make", "made", "maked", "making"], "a": 1, "e": "yesterday 表示過去，make 的 V2 是 made。"}, {"q": "choose 的過去分詞是？", "o": ["chose", "choosed", "chosen", "choosing"], "a": 2, "e": "choose → chose → chosen。"}, {"q": "I have never _____ this movie.", "o": ["see", "saw", "seen", "seeing"], "a": 2, "e": "have + V3，see 的 V3 是 seen。"}, {"q": "The students _____ the classroom after school yesterday.", "o": ["clean", "cleaned", "cleaning", "cleans"], "a": 1, "e": "yesterday 表示過去，clean 加 -ed。"}, {"q": "stop 的過去式是？", "o": ["stoped", "stopped", "stopt", "stopping"], "a": 1, "e": "stop 雙寫 p 再加 -ed：stopped。"}, {"q": "The baby has _____ asleep.", "o": ["fall", "fell", "fallen", "falling"], "a": 2, "e": "fall → fell → fallen；has 後面用 fallen。"}, {"q": "My dad _____ a new phone two days ago.", "o": ["buy", "bought", "buyed", "buys"], "a": 1, "e": "two days ago 表示過去，buy 的 V2 是 bought。"}, {"q": "take 的三態是哪一組？", "o": ["take－taked－taken", "take－took－taken", "take－took－took", "take－taken－took"], "a": 1, "e": "take → took → taken。"}, {"q": "The dog has _____ all the food.", "o": ["eat", "ate", "eaten", "eats"], "a": 2, "e": "has + V3，eat 的 V3 是 eaten。"}, {"q": "Amy _____ a letter to her friend last night.", "o": ["write", "wrote", "written", "writes"], "a": 1, "e": "last night 表示過去，用 wrote。"}, {"q": "We have _____ our homework.", "o": ["do", "did", "done", "doing"], "a": 2, "e": "do → did → done；have 後面用 done。"}, {"q": "teach 的過去式和過去分詞是？", "o": ["teached－teached", "taught－taught", "taught－teached", "teach－taught"], "a": 1, "e": "teach → taught → taught，V2 和 V3 相同。"}, {"q": "The boy _____ a glass this morning.", "o": ["break", "broke", "broken", "breaking"], "a": 1, "e": "描述已發生的過去事件，使用 V2 broke。"}, {"q": "Have you ever _____ to Korea?", "o": ["be", "was", "been", "being"], "a": 2, "e": "Have you ever been to...? 是詢問是否曾去過某地。"}, {"q": "carry 的過去式是？", "o": ["carryed", "carried", "carries", "carrying"], "a": 1, "e": "子音 + y 結尾，去 y 加 ied：carried。"}];let i=0,answers=[],locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;$("game").style.display="block";$("result").style.display="none";$("count").textContent=`第 ${i+1} / ${qs.length} 題`;$("bar").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i].q;$("options").innerHTML="";$("feedback").style.display="none";$("next").style.display="none";qs[i].o.forEach((v,j)=>{const b=document.createElement("button");b.className="option";const l=document.createElement("span");l.className="letter";l.textContent=String.fromCharCode(65+j);const t=document.createElement("span");t.textContent=v;b.append(l,t);b.onclick=()=>choose(j);$("options").append(b)})}
function choose(j){if(locked)return;locked=true;answers[i]=j;const q=qs[i];[...$("options").children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("correct");if(k===j&&j!==q.a)b.classList.add("wrong")});$("feedback").style.display="block";$("feedback").innerHTML=`<strong>${j===q.a?"答對了！":"再記住這個觀念！"}</strong><br>${q.e}`;$("next").textContent=i===qs.length-1?"查看總成績":"下一題";$("next").style.display="block";$("bar").style.width=`${(i+1)/qs.length*100}%`}
function finish(){$("game").style.display="none";$("result").style.display="block";const s=answers.filter((a,k)=>a===qs[k].a).length;$("score").textContent=`${s} / ${qs.length} 分（${Math.round(s/qs.length*100)}%）`;$("review").innerHTML="";qs.forEach((q,k)=>{const d=document.createElement("div");d.className="review";const st=document.createElement("strong");st.textContent=`第 ${k+1} 題：${answers[k]===q.a?"答對":"答錯"}`;const p=document.createElement("div");p.textContent=`正確答案：${q.o[q.a]}`;const sm=document.createElement("div");sm.className="small";sm.textContent=q.e;d.append(st,p,sm);$("review").append(d)})}
$("next").onclick=()=>{if(i===qs.length-1)finish();else{i++;render()}};$("again").onclick=()=>{i=0;answers=[];render()};render();
</script></body></html>
